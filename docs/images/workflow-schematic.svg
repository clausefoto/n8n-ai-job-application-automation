<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="600" viewBox="0 0 1880 600" role="img" aria-labelledby="title desc">
<title id="title">n8n automated job search, filtering, scoring and document preparation</title>
<desc id="desc">23-node n8n workflow simplified into two horizontal branches for screening, job scoring and human-selected application preparation.</desc>
<rect width="1880" height="600" rx="28" fill="#F5F7FA"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.lane{font-size:23px;letter-spacing:1.2px;font-weight:700;fill:#23384C}.node{font-size:17px;font-weight:700;fill:#163047}.sub{font-size:12px;fill:#53697D}.hint{font-size:13px;fill:#687B8C}</style>
