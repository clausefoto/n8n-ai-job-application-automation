" text-anchor="middle">AI eligibility</text><text class="sub" x="840" y="196" text-anchor="middle">Remote / clearance</text><path d="M 924 180 L 931 180" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 926 174 L 934 180 L 926 186" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="939" y="135" width="164" height="92" rx="13" fill="#FFFFFF" stroke="#C4D0DC" stroke-width="1.5"/><text class="node" x="1021" y="171" text-anchor="middle">Sheet update</text><text class="sub" x="1021" y="196" text-anchor="middle">0 + reason</text><path d="M 1105 180 L 1112 180" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1107 174 L 1115 180 L 1107 186" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="1120" y="135" width="164" height="92" rx="13" fill="#FFFFFF" stroke="#C4D0DC" stroke-width="1.5"/><text class="node" x="1202" y="171" text-anchor="middle">Re-query rows</text><text class="sub" x="1202" y="196" text-anchor="middle">Still unrated</text><path d="M 1286 180 L 1293 180" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1288 174 L 1296 180 L 1288 186" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="1301" y="135" width="164" height="92" rx="13" fill="#FFFFFF" stroke="#C4D0DC" stroke-width="1.5"/><text class="node" x="1383" y="171" text-anchor="middle">Career profile</text><text class="sub" x="1383" y="196" text-anchor="middle">Rating context</text><path d="M 1467 180 L 1474 180" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1469 174 L 1477 180 L 1469 186" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="1482" y="135" width="164" height="92" rx="13" fill="#F8FCFF" stroke="#287C9A" stroke-width="2.5"/><text class="node" x="1564" y="171" text-anchor="middle">AI rating</text><text class="sub" x="1564" y="196" text-anchor="middle">Fit / salary / benefits</text><path d="M 1648 180 L 1655 180" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1650 174 L 1658 180 L 1650 186" stroke="#839AAB" stroke-width="3" fill="