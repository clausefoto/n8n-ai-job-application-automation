dle">AI drafting</text><text class="sub" x="730" y="482" text-anchor="middle">Résumé + letter</text><path d="M 820 466 L 834 466" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 829 460 L 837 466 L 829 472" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="842" y="421" width="176" height="92" rx="13" fill="#F8FCFF" stroke="#287C9A" stroke-width="2.5"/><text class="node" x="930" y="457" text-anchor="middle">AI review</text><text class="sub" x="930" y="482" text-anchor="middle">Accuracy + JSON</text><path d="M 1020 466 L 1034 466" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1029 460 L 1037 466 L 1029 472" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="1042" y="421" width="176" height="92" rx="13" fill="#FFFFFF" stroke="#C4D0DC" stroke-width="1.5"/><text class="node" x="1130" y="457" text-anchor="middle">Code validation</text><text class="sub" x="1130" y="482" text-anchor="middle">Template values</text><path d="M 1220 466 L 1234 466" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1229 460 L 1237 466 L 1229 472" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="1242" y="421" width="176" height="92" rx="13" fill="#FFFFFF" stroke="#C4D0DC" stroke-width="1.5"/><text class="node" x="1330" y="457" text-anchor="middle">Google Drive</text><text class="sub" x="1330" y="482" text-anchor="middle">Copy templates</text><path d="M 1420 466 L 1434 466" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1429 460 L 1437 466 L 1429 472" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="1442" y="421" width="176" height="92" rx="13" fill="#FFFFFF" stroke="#C4D0DC" stroke-width="1.5"/><text class="node" x="1530" y="457" text-anchor="middle">Google Docs API</text><text class="sub" x="1530" y="482" text-anchor="middle">Replace text</text><path d="M 1620 466 L 1634 466" stroke="#839AAB" stroke-width="3" fill="none"/><path d="M 1629 460 L 1637 466 L 1629 472" stroke="#839AAB" stroke-width="3" fill="none"/><rect x="1642" y="421" width="176" height="92" rx="13" fill="#FFFFFF" stroke="#C4D0DC" stroke-width="1.5"/><text class="node" x="1730" y="457" text-anchor="middle">Google Sheets</text><text class="sub" x="1730" y="482" text-anchor="middle">Write doc links</text><text class="hint" x="44" y="552">Application documents are prepared only after human selection; no automatic job submission</text></svg>
